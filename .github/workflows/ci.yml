name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install ruff and pytest
        run: python -m pip install ruff pytest
      - name: Lint (ruff, scope in ruff.toml)
        run: ruff check .
      - name: layout and no-public-grade check
        run: python tests/test_smoke.py
      - name: level 1 learn tests
        run: python tests/test_learn_platform.py
      - name: level 1 learn run
        run: python level-1-learn/run_learn.py
      - name: level 2 build tests
        run: python tests/test_build_platform.py
      - name: level 2 build run
        run: python level-2-build/run_build.py
      - name: level 3 deep tests
        run: python tests/test_deep_platform.py
      - name: level 3 deep run
        run: python level-3-deep/run_deep.py
      - name: randomized invariant tests
        run: python tests/test_invariants.py
      - name: check counts match call sites
        run: python tests/test_check_counts.py
      - name: pytest collection of the whole suite
        run: python -m pytest tests/ -q
      - name: results regenerate unchanged from the code
        run: git diff --exit-code level-1-learn/results_learn.json level-2-build/results_build.json level-3-deep/results_deep.json
